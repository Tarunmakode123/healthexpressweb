<svg viewBox="0 0 96 96" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="tubeGlass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8"/>
      <stop offset="25%" stop-color="#e0f2fe" stop-opacity="0.4"/>
      <stop offset="80%" stop-color="#bae6fd" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="bloodGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="60%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <linearGradient id="capGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="lensRing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <radialGradient id="cellGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="70%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </radialGradient>
    <linearGradient id="handleGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
  </defs>

  <!-- Shadow -->
  <ellipse cx="32" cy="84" rx="14" ry="4" fill="#000000" fill-opacity="0.12"/>
  
  <!-- Test Tube Body (Angled) -->
  <g transform="rotate(-15 32 48)">
    <rect x="23" y="16" width="18" height="52" rx="9" fill="url(#tubeGlass)"/>
    <path d="M23 38 C26 36, 38 40, 41 38 L41 59 C41 64, 37 68, 32 68 C27 68, 23 64, 23 59 Z" fill="url(#bloodGrad)"/>
    <ellipse cx="32" cy="38" rx="8" ry="2" fill="#fca5a5" fill-opacity="0.6"/>
    <line x1="26" y1="44" x2="31" y2="44" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.8"/>
    <line x1="26" y1="50" x2="34" y2="50" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.8"/>
    <line x1="26" y1="56" x2="30" y2="56" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.8"/>
    <path d="M25 20 L25 58" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-opacity="0.75"/>
    <rect x="21" y="10" width="22" height="10" rx="3" fill="url(#capGrad)"/>
    <ellipse cx="32" cy="10" rx="11" ry="3" fill="#38bdf8"/>
  </g>

  <!-- 3D Magnifying Glass -->
  <circle cx="62" cy="40" r="18" fill="#e0f2fe" fill-opacity="0.45" stroke="url(#lensRing)" stroke-width="4"/>
  <circle cx="58" cy="37" r="7.5" fill="url(#cellGrad)"/>
  <ellipse cx="56" cy="35" rx="3.5" ry="2" fill="#ffffff" fill-opacity="0.45"/>
  <circle cx="68" cy="44" r="5" fill="url(#cellGrad)"/>
  <ellipse cx="67" cy="43" rx="2" ry="1.2" fill="#ffffff" fill-opacity="0.45"/>
  <path d="M50 30 A14 14 0 0 1 72 28" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.8"/>
  <path d="M75 53 L87 68" stroke="url(#handleGrad)" stroke-width="6" stroke-linecap="round"/>
  <path d="M75 53 L87 68" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.5"/>
</svg>
