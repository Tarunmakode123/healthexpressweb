<svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="vaultBody" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#c084fc"/><stop offset="50%" stop-color="#8b5cf6"/><stop offset="100%" stop-color="#581c87"/></linearGradient>
    <linearGradient id="vaultDoor" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#ffffff"/><stop offset="100%" stop-color="#e2e8f0"/></linearGradient>
    <linearGradient id="vaultWheel" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#fbbf24"/><stop offset="100%" stop-color="#d97706"/></linearGradient>
  </defs>
  <ellipse cx="32" cy="58" rx="22" ry="4" fill="#000000" fill-opacity="0.15"/>
  <!-- Safe Outer Casing -->
  <rect x="12" y="14" width="40" height="42" rx="8" fill="url(#vaultBody)" stroke="#4c1d95" stroke-width="2"/>
  <!-- Safe Door Inset -->
  <rect x="16" y="18" width="32" height="34" rx="5" fill="url(#vaultDoor)" stroke="#cbd5e1" stroke-width="1.5"/>
  <!-- Medical Cross on Safe Door -->
  <rect x="29" y="24" width="6" height="18" rx="2" fill="#8b5cf6"/>
  <rect x="23" y="30" width="18" height="6" rx="2" fill="#8b5cf6"/>
  <!-- Central Rotary Vault Wheel -->
  <circle cx="32" cy="33" r="6" fill="url(#vaultWheel)" stroke="#ffffff" stroke-width="1.5"/>
  <circle cx="32" cy="33" r="2.5" fill="#78350f"/>
  <!-- Rivets -->
  <circle cx="18" cy="20" r="1" fill="#94a3b8"/><circle cx="46" cy="20" r="1" fill="#94a3b8"/>
  <circle cx="18" cy="50" r="1" fill="#94a3b8"/><circle cx="46" cy="50" r="1" fill="#94a3b8"/>
</svg>