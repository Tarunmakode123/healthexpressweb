<svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="goldMedal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="35%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="emeraldCenter" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="70%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="ribbonLeft" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>
    <linearGradient id="ribbonRight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#6b21a8"/>
    </linearGradient>
  </defs>

  <!-- Hanging Ribbons -->
  <path d="M25 36 L17 58 L27 52 L31 58 L32 38 Z" fill="url(#ribbonLeft)"/>
  <path d="M39 36 L47 58 L37 52 L33 58 L32 38 Z" fill="url(#ribbonRight)"/>

  <!-- Outer Star Rosette Points -->
  <circle cx="32" cy="28" r="21" fill="url(#goldMedal)"/>
  <circle cx="32" cy="28" r="18" fill="#ffffff" fill-opacity="0.25"/>

  <!-- Inner Emerald Core -->
  <circle cx="32" cy="28" r="15" fill="url(#emeraldCenter)"/>
  <circle cx="32" cy="28" r="15" stroke="#ffffff" stroke-width="1.2" stroke-opacity="0.6"/>

  <!-- Embossed Medical Cross in Center -->
  <rect x="30" y="19" width="4" height="18" rx="1.5" fill="#ffffff"/>
  <rect x="23" y="26" width="18" height="4" rx="1.5" fill="#ffffff"/>

  <!-- Specular Glare -->
  <path d="M20 20 A16 16 0 0 1 44 20" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-opacity="0.8"/>
  <circle cx="43" cy="20" r="1.5" fill="#ffffff"/>
</svg>