<svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="phoneBody" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="boltGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
  </defs>

  <!-- Shadow -->
  <ellipse cx="32" cy="58" rx="18" ry="3.5" fill="#000000" fill-opacity="0.12"/>

  <!-- Smart Digital Document / Tablet -->
  <rect x="18" y="10" width="28" height="42" rx="5" fill="url(#phoneBody)" stroke="#0284c7" stroke-width="1.5"/>
  <rect x="21" y="14" width="22" height="34" rx="3" fill="#ffffff"/>

  <!-- Mini Chart & Report Lines inside Screen -->
  <rect x="24" y="18" width="12" height="3" rx="1.5" fill="#0284c7"/>
  <line x1="24" y1="26" x2="39" y2="26" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="24" y1="31" x2="36" y2="31" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Mini ECG Pulse Line -->
  <path d="M24 38 L27 38 L29 35 L31 41 L33 36 L35 38 L39 38" stroke="#10b981" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Glowing 3D Speed Bolt on Front -->
  <path d="M42 20 L31 34 L38 34 L33 48 L46 32 L39 32 Z" fill="url(#boltGrad)" stroke="#ffffff" stroke-width="1.5"/>

  <!-- Mini "6h" Fast Badge -->
  <rect x="36" y="8" width="16" height="10" rx="3" fill="#10b981" stroke="#ffffff" stroke-width="1"/>
  <text x="44" y="15.5" font-family="Arial, sans-serif" font-weight="900" font-size="7" fill="#ffffff" text-anchor="middle">6h</text>
</svg>