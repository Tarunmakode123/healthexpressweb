<svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="headsetGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="50%" stop-color="#9333ea"/>
      <stop offset="100%" stop-color="#6b21a8"/>
    </linearGradient>
    <linearGradient id="stethGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="faceGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
  </defs>

  <!-- Shadow -->
  <ellipse cx="32" cy="58" rx="16" ry="3.5" fill="#000000" fill-opacity="0.1"/>

  <!-- Professional Headset Headband Arch -->
  <path d="M16 28 C16 17, 48 17, 48 28" stroke="url(#headsetGrad)" stroke-width="4" stroke-linecap="round" fill="none"/>
  
  <!-- Headset Ear Cushions -->
  <rect x="13" y="24" width="6" height="12" rx="3" fill="#6b21a8"/>
  <rect x="45" y="24" width="6" height="12" rx="3" fill="#6b21a8"/>

  <!-- Microphone Arm curving to mouth -->
  <path d="M16 33 C16 44, 27 46, 32 46" stroke="#9333ea" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <circle cx="33" cy="46" r="2.5" fill="#10b981"/>

  <!-- Acoustic Voice Signal Waves -->
  <path d="M51 22 A8 8 0 0 1 51 38" stroke="#10b981" stroke-width="2" stroke-linecap="round" fill="none"/>
  <path d="M55 18 A13 13 0 0 1 55 42" stroke="#10b981" stroke-width="1.8" stroke-linecap="round" stroke-opacity="0.6" fill="none"/>

  <!-- Doctor's Stethoscope encircling the base -->
  <path d="M22 46 C22 56, 42 56, 42 46" stroke="url(#stethGrad)" stroke-width="3" stroke-linecap="round" fill="none"/>
  <circle cx="32" cy="54" r="4.5" fill="#ffffff" stroke="#0284c7" stroke-width="2"/>
  <circle cx="32" cy="54" r="2" fill="#0284c7"/>
</svg>