    <linearGradient id="tubeRed" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#ef4444"/><stop offset="100%" stop-color="#991b1b"/></linearGradient>
  </defs>
  <ellipse cx="32" cy="58" rx="20" ry="3.5" fill="#000000" fill-opacity="0.12"/>
